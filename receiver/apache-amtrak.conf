# Lines for an Apache HTTPS virtual host that puts the receiver on a path.
# They go inside the existing <VirtualHost *:443>. Modules: proxy, proxy_http, setenvif.

# If the virtual host redirects most paths elsewhere, let /amtrak/ through the
# redirect. In a negative lookahead that looks like:
#   RedirectMatch 301 "^/(?!other/|amtrak/)(.*)$" "https://example.test/$1"

ProxyPass /amtrak/ http://127.0.0.1:8765/amtrak/ timeout=30
LimitRequestBody 1048576

# Keep uploads out of the access log, so it holds no sender addresses for them.
# Add env=!amtrak_nolog to the virtual host's existing CustomLog line:
#   CustomLog ${APACHE_LOG_DIR}/example_access.log combined env=!amtrak_nolog
SetEnvIf Request_URI "^/amtrak/" amtrak_nolog
